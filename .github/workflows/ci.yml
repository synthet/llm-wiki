name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python3 -m pytest -q

  wiki:
    # Validate the knowledge base itself on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[yaml]"
      - name: Lint-validate the wiki (strict)
        run: PYTHONPATH=src python3 -m llmwiki.cli --root wiki lint --strict
      - name: Build index (smoke test)
        run: PYTHONPATH=src python3 -m llmwiki.cli --root wiki index

  wiki-nodeps:
    # Prove the toolkit and stdlib YAML fallback work with zero dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint-validate with no third-party packages installed
        run: PYTHONPATH=src python3 -m llmwiki.cli --root wiki lint --strict
